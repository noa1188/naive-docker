name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      manualTag:
        description: "Image tag, for example v1.0.0"
        required: true
      pushLatest:
        description: "Also push latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: yourdockerhubusername/naiveproxy-docker

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate tags
        id: tags
        run: |
          VERSION_TAG="${{ github.event.inputs.manualTag }}"
          echo "version_tag=${IMAGE_NAME}:${VERSION_TAG}" >> $GITHUB_OUTPUT

          if [ "${{ github.event.inputs.pushLatest }}" = "true" ]; then
            echo "latest_tag=${IMAGE_NAME}:latest" >> $GITHUB_OUTPUT
          else
            echo "latest_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.latest_tag }}
